[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-lab"
version = "0.1.0"
description = "Offline-first local LLM experiment laboratory"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
llm-lab = "llmlab.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
